<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base href="/montagem/camisa-coritiba/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Montagem 3D Camisa Coritiba</title>
<style>
  html,body{margin:0;height:100%;background:#a9aca8;transition:background .4s;font-family:system-ui,-apple-system,sans-serif;color:#1d1d1b;overflow:hidden}
  #stage{position:fixed;inset:0 0 var(--panel-h,132px) 0}
  #stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  #load{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#2b2d2a}
  .panel{position:fixed;left:0;right:0;bottom:0;box-sizing:border-box;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:transparent;display:flex;flex-direction:column;gap:10px;align-items:center}
  .row{display:flex;align-items:center;gap:10px;width:100%;max-width:760px}
  .label{font-weight:600;font-size:15px;min-width:118px;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;min-width:0;height:44px;accent-color:#1c523c;cursor:pointer}
  button{min-height:44px;min-width:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(0,0,0,.12);background:#fff;color:#1d1d1b;font:600 15px system-ui,sans-serif;cursor:pointer}
  button:hover{background:#f3f3f2}
  button:focus-visible,input:focus-visible{outline:2px solid #1d1d1b;outline-offset:2px}
  button.dark{background:#1d1d1b;color:#fff;border-color:#1d1d1b}
  button.dark:hover{background:#333}
  .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  @media(max-width:520px){.label{min-width:92px;font-size:14px}button{padding:0 12px;font-size:14px}}
  body.verde{background:radial-gradient(120% 90% at 50% 30%,#1f6b47 0%,#0d3a26 55%,#04170e 100%);color:#eef4ef}
  body.verde .label{color:#eef4ef}
  body.drama{background:radial-gradient(90% 70% at 50% 38%,#8e918c 0%,#5b5e59 55%,#2c2e2b 100%);color:#f0f1ee}
  body.drama .label{color:#f0f1ee}
  body.drama.verde{background:radial-gradient(85% 65% at 50% 36%,#1a5c3c 0%,#0a2c1c 55%,#020a06 100%)}
  body.verde #load{color:#cfe3d6}
  body.noite{background:radial-gradient(90% 75% at 50% 40%,#211913 0%,#0b0806 60%,#000 100%) !important;color:#efe9e0}
  body.noite .label{color:#e9e4dc}
  body.noite #bg{display:none}
</style>
</head>
<body>
<div id="stage"><div id="load">Carregando o modelo…</div></div>
<div class="panel">
  <div class="row">
    <span class="label" id="lbl">Passo 0 de 41</span>
    <input type="range" id="bar" min="0" max="41" step="0.01" value="0" aria-label="Progresso da montagem">
  </div>
  <div class="btns">
    <button type="button" id="prev" aria-label="Passo anterior">◀</button>
    <button type="button" id="play" class="dark">Montar</button>
    <button type="button" id="next" aria-label="Próximo passo">▶</button>
    <button type="button" id="reset">Voltar à posição original</button>
    <button type="button" id="bg" aria-pressed="false">Fundo verde</button>
    <button type="button" id="shelf" aria-pressed="false">Na escrivaninha</button>
  </div>
</div>

<script>
// o palco 3D termina onde começa o painel (no celular os botões quebram em mais de uma linha)
(function(){ const pn = document.querySelector('.panel'); const fit = () => document.documentElement.style.setProperty('--panel-h', pn.offsetHeight + 'px');
  new ResizeObserver(fit).observe(pn); fit(); })();
</script>
<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/RoomEnvironment.js"></script>
<script>
{
const MODEL = 'assets/camisa-coritiba.glb';
const stage = document.getElementById('stage');
const r = new THREE.WebGLRenderer({antialias:true, alpha:true}); r.setClearColor(0x000000, 0);
r.setPixelRatio(Math.min(devicePixelRatio,2));
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(r.domElement);
const sc = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff,0x9a9c98,0.35); sc.add(hemi);
const pmrem = new THREE.PMREMGenerator(r);
sc.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
r.toneMappingExposure = 0.95; r.physicallyCorrectLights = false;
const key = new THREE.DirectionalLight(0xfff6ea,1.35); key.position.set(-3,7,-5); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:1,far:20}); key.shadow.bias = -0.0004;
sc.add(key);
const rim = new THREE.DirectionalLight(0xdff2ff,0.9); rim.position.set(4,4.5,6); sc.add(rim);
const kick = new THREE.SpotLight(0xffffff,0.6,30,0.5,0.6); kick.position.set(5,6,-6); kick.target.position.set(0,2,0); sc.add(kick); sc.add(kick.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.ShadowMaterial({opacity:0.22}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; sc.add(floor);

const cam = new THREE.PerspectiveCamera(30,1,0.1,100);
const START0 = new THREE.Vector3(-2.6,5.2,-8.7), TARGET0 = new THREE.Vector3(0,2.0,0);
let START = START0.clone(), TARGET = TARGET0.clone();
cam.position.copy(START);
const ctl = new THREE.OrbitControls(cam, r.domElement);
ctl.target.copy(TARGET); ctl.enableDamping = true; ctl.dampingFactor = 0.08;
ctl.minDistance = 3; ctl.maxDistance = 24; ctl.maxPolarAngle = Math.PI*0.52; ctl.enablePan = false;

const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; r.setSize(w,h,false); cam.aspect = w/h; cam.updateProjectionMatrix(); };
new ResizeObserver(resize).observe(stage); resize();

// montagem: cada etapa ocupa 1 unidade da barra; as peças da etapa entram em sequência dentro dela
const easeOutBack = x => { const c1 = 1.3, c3 = c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
let pieces = [], NSTEPS = 41, value = 0;
// submontagens do manual: corpo (encaixa no passo 41), mangas (passo 30), recheio interno (passo 11)
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
function apply(v){
  value = v;
  const torso = (1 - easeIO(clamp01(v - 40))) * 0.9;
  const sleeve = (1 - easeIO(clamp01(v - 29))) * 0.8;
  const inner = (1 - easeIO(clamp01(v - 10))) * 1.1;
  for (const n of pieces){
    const k = (v - n.userData.t0) / n.userData.dur;
    if (k <= 0){ n.visible = false; continue; }
    n.visible = true;
    const e = k >= 1 ? 1 : easeOutBack(k);
    const a = n.userData.asm;
    n.position.set(
      a === 2 ? -sleeve : a === 3 ? sleeve : 0,
      (1-e) * 0.6 + (a >= 1 ? torso : 0),
      a === 4 ? -inner : 0);
  }
  const step = Math.min(NSTEPS, Math.ceil(v - 1e-6));
  lbl.textContent = 'Passo ' + Math.max(0,step) + ' de ' + NSTEPS;
  bar.value = v;
}

const bar = document.getElementById('bar'), lbl = document.getElementById('lbl'), play = document.getElementById('play');
let playing = false, last = 0;
const setPlay = on => { playing = on; play.textContent = on ? 'Pausar' : (value >= NSTEPS ? 'Montar de novo' : 'Montar'); };
bar.addEventListener('input', () => { setPlay(false); apply(+bar.value); });
play.addEventListener('click', () => { if (!playing && value >= NSTEPS) apply(0); setPlay(!playing); });
const go = d => { setPlay(false); const target = d > 0 ? Math.floor(value + 1e-6) + 1 : Math.ceil(value - 1e-6) - 1; tween(Math.max(0, Math.min(NSTEPS, target))); };
let tw = null;
function tween(to){ tw = {from:value, to, t:0}; }
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('reset').addEventListener('click', () => { camTw = {from:cam.position.clone(), t:0}; tgTw = {from:ctl.target.clone(), t:0}; });
addEventListener('keydown', e => { if (e.target === bar) return; if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); if (e.key === ' ') { e.preventDefault(); play.click(); } });
let camTw = null, tgTw = null;
// ===== cenário: escrivaninha em escala real (1 unidade = 4 cm; a camisa tem cerca de 12 x 14 cm) =====
const CM = 0.25;
const shelf = new THREE.Group(); shelf.visible = false; sc.add(shelf);
function woodTex(){
  const c = document.createElement('canvas'); c.width = 2048; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#4d301c'; g.fillRect(0,0,2048,512);
  for (let i = 0; i < 260; i++){
    const y = Math.random()*512, a = 0.04 + Math.random()*0.10, w = 0.6 + Math.random()*2.4;
    g.strokeStyle = Math.random() < .5 ? `rgba(25,12,4,${a*1.4})` : `rgba(160,105,60,${a})`; g.lineWidth = w;
    g.beginPath(); g.moveTo(0,y);
    for (let x = 0; x <= 2048; x += 32) g.lineTo(x, y + Math.sin(x/110 + i)*3.5 + Math.sin(x/27 + i*2));
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
// madeira fosca (acetinada): sem verniz, para a luz da frente não deixar o tampo esbranquiçado
const wood = new THREE.MeshStandardMaterial({map: woodTex(), roughness: 0.82, metalness: 0, envMapIntensity: 0.3});
const mat = (c, r=0.6, extra={}) => new THREE.MeshPhysicalMaterial(Object.assign({color: c, roughness: r, envMapIntensity: 0.6}, extra));
function box(w,h,d,x,y,z,m,cast=true){ const o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); o.position.set(x,y,z); o.castShadow = cast; o.receiveShadow = true; shelf.add(o); return o; }
// tampo de 140 x 70 cm, 3 cm de espessura; parede a 10 cm do fundo
// escrivaninha 3D (121 x 60 cm): área de trabalho a 75,8 cm do chão, com prateleira traseira 12,1 cm mais alta.
// A área de trabalho fica em y = 0 na cena; a escrivaninha é girada para a frente dela ficar do lado da câmera.
const DESK_Z = 2.5, ZF = DESK_Z - 30*CM, ZB = DESK_Z + 30*CM, DESK_H = 75.8*CM, SHELF_Y = 12.1*CM;
box(400, 0.2, 400, 0, -DESK_H, mat(0x0e0b08, 0.9, {envMapIntensity: 0.2}), false);
function wallTex(){ const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  const gr = g.createRadialGradient(512, 640, 20, 512, 600, 560); gr.addColorStop(0, '#3a2c21'); gr.addColorStop(0.45, '#17110c'); gr.addColorStop(1, '#000');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
const wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshBasicMaterial({map: wallTex(), toneMapped: false, fog: false}));
wall.position.set(0, 4, ZB + 10*CM); wall.rotation.y = Math.PI; shelf.add(wall);
// notebook fechado (32 x 22 cm)
// caderno com caneta (21 x 28 cm)
// caneca e luminária: modelos 3D (arquivos em metros; 1 m = 100*CM unidades)
const LAMP_ROT = -0.2507, LAMP_BASE = new THREE.Vector3(8.6, 0, 1.6);
const MUG_POS = new THREE.Vector3(4.4, 0, -0.8);
function addModel(url, setup){ new THREE.GLTFLoader().load(url, g => { const o = g.scene; o.scale.setScalar(100*CM); setup(o);
  o.traverse(m => { if (m.isMesh){ m.castShadow = !/luminaria/.test(url); m.receiveShadow = true;
    if (m.material && 'envMapIntensity' in m.material){ m.userData.env0 = 0.6; m.material.envMapIntensity = shelf.visible ? 0.6*0.42 : 0.6; } } });
  shelf.add(o); }); }
addModel('assets/caneca.glb', o => { o.position.copy(MUG_POS); o.rotation.y = 2.2; });
const coffee = new THREE.Mesh(new THREE.CircleGeometry(4.2*CM, 48), new THREE.MeshStandardMaterial({color: 0x2a160b, roughness: 0.15}));
coffee.rotation.x = -Math.PI/2; coffee.position.set(MUG_POS.x, 9.6*CM, MUG_POS.z); shelf.add(coffee);
addModel('assets/escrivaninha.glb', o => { o.position.set(0, -DESK_H, DESK_Z); o.rotation.y = Math.PI;
  o.traverse(m => { if (m.isMesh){ m.material = wood; m.castShadow = false; } }); });
// caderno A6 (o arquivo vem 10x maior) e celular deitado sobre a mesa
addModel('assets/caderno.glb', o => { o.scale.setScalar(10*CM); o.position.set(-5.8, 0.035*10*CM, -1.2); o.rotation.y = 1.35; });
addModel('assets/celular.glb', o => { o.rotation.set(-Math.PI/2, 0, 0.35); o.position.set(-8.4, 0.5*CM, 1.2); });
addModel('assets/luminaria.glb', o => { o.position.copy(LAMP_BASE); o.rotation.y = LAMP_ROT; });
// luminária de mesa (fonte de luz quente)
const lampMat = mat(0x1d1d1b, 0.4, {metalness: 0.5});
// caixa do produto em pé, ao lado da camisa (25 x 17,5 x 5 cm; o arquivo vem em metros)
const BOX_URL = 'assets/caixa-camisa.glb';
new THREE.GLTFLoader().load(BOX_URL, g => {
  const bx = g.scene; bx.scale.setScalar(100*CM);
  bx.position.set(-4.7, 0, 2.6); bx.rotation.y = Math.PI + 0.28;
  bx.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true;
    if (o.material && 'envMapIntensity' in o.material){ o.userData.env0 = 0.6; o.material.envMapIntensity = shelf.visible ? 0.6*0.42 : 0.6; } } });
  shelf.add(bx);
});
// posição da lâmpada do modelo (centro da cúpula), já girada e na escala da cena
const bulb = {position: new THREE.Vector3(-0.156, 0.4245, 0).multiplyScalar(100*CM).applyAxisAngle(new THREE.Vector3(0,1,0), LAMP_ROT).add(LAMP_BASE)};
const ledLight = new THREE.SpotLight(0xffd3a0, 0, 30, 0.85, 1, 1.2); ledLight.position.copy(bulb.position);
ledLight.target.position.set(0, 1.6, -0.6); ledLight.castShadow = true; ledLight.shadow.mapSize.set(2048,2048); ledLight.shadow.bias = -0.0005;
shelf.add(ledLight); shelf.add(ledLight.target);
const lampGlow = new THREE.PointLight(0xffb76b, 0, 7, 2); lampGlow.position.copy(bulb.position); shelf.add(lampGlow);
const moon = new THREE.DirectionalLight(0x8fa8c8, 0); moon.position.set(-12, 9, 4); sc.add(moon);
const NIGHT_BG = 0x000000;
function applyNight(){
  // fim de tarde com a luz do quarto baixa: ambiente quente suave, janela fria de lado, abajur como destaque
  // luz mais macia: preenchimento quente pela frente e abajur mais suave, para não estourar a madeira nem acinzentar o branco
  hemi.intensity = 0.34; hemi.color.setHex(0xfff0e0); hemi.groundColor.setHex(0x3a2a1e);
  key.intensity = 0.62; key.color.setHex(0xffe2c4); key.position.set(-4, 16, -6);
  rim.intensity = 0.18; rim.color.setHex(0x9fb6d6); rim.position.set(5, 6, 7);
  kick.intensity = 0; moon.intensity = 0.12;
  ledLight.intensity = 1.35; lampGlow.intensity = 0.45; r.toneMappingExposure = 1.0;
  sc.traverse(o => { if (o.isMesh && o.material && 'envMapIntensity' in o.material) {
    if (o.userData.env0 === undefined) o.userData.env0 = o.material.envMapIntensity;
    o.material.envMapIntensity = o.userData.env0 * 0.42; } });
  sc.fog = new THREE.Fog(NIGHT_BG, 30, 70);
  sc.traverse(o => { if (o.isLineSegments){ if (o.userData.op0 === undefined) o.userData.op0 = o.material.opacity; o.material.opacity = o.userData.op0 * 0.55; } });
}
const shelfBtn = document.getElementById('shelf');
function setShelf(on){
  shelf.visible = on; floor.visible = !on; ledLight.intensity = on ? 1.7 : 0;
  Object.assign(key.shadow.camera, on ? {left:-12,right:12,top:12,bottom:-12} : {left:-3,right:3,top:3,bottom:-3}); key.shadow.camera.updateProjectionMatrix();
  START = on ? new THREE.Vector3(-3.6, 8.8, -27) : START0.clone(); TARGET = on ? new THREE.Vector3(0, 3.6, 2.0) : TARGET0.clone();
  // tela em pé (celular): afasta a câmera para a escrivaninha caber na largura
  if (on && cam.aspect < 1) START = START.clone().sub(TARGET).multiplyScalar(Math.min(2.2, 1.25/cam.aspect)).add(TARGET);
  ctl.minAzimuthAngle = on ? Math.PI - 1.0 : -Infinity; ctl.maxAzimuthAngle = on ? -Math.PI + 1.0 : Infinity;
  ctl.minPolarAngle = on ? Math.PI*0.2 : 0; ctl.maxPolarAngle = on ? Math.PI*0.47 : Math.PI*0.52;
  ctl.maxDistance = on ? (cam.aspect < 1 ? 70 : 32) : 16; ctl.minDistance = on ? 4 : 3;
  key.intensity = on ? LIGHT[lightMode].key[0]*0.75 : LIGHT[lightMode].key[0];
  camTw = {from: cam.position.clone(), t: 0}; tgTw = {from: ctl.target.clone(), t: 0};
  shelfBtn.setAttribute('aria-pressed', on); shelfBtn.textContent = on ? 'Sem escrivaninha' : 'Na escrivaninha';
  document.body.classList.toggle('noite', on);
  if (on) applyNight(); else { hemi.color.setHex(0xffffff); hemi.groundColor.setHex(0x9a9c98); sc.traverse(o => { if (o.isLineSegments && o.userData.op0 !== undefined) o.material.opacity = o.userData.op0; }); sc.fog = null; moon.intensity = 0; lampGlow.intensity = 0; ledLight.intensity = 0; setLight(lightMode); }
}
shelfBtn.addEventListener('click', () => setShelf(!shelf.visible));
// luz: estúdio (padrão) x dramática (lateral quente, contraluz frio, ambiente baixo, sombra funda)
const envTex = sc.environment;
const LIGHT = {
  estudio:  {hemi:0.28, env:0.8, key:[1.05,0xfff6ea,-3,7,-5], rim:[0.7,0xdff2ff,4,4.5,6], kick:0.45, shadow:0.22, exp:0.8},
  dramatica:{hemi:0.05, env:0.3, key:[1.7,0xffe2bd,-6,4.2,-2.5], rim:[1.5,0xbfe6ff,5,6,6.5], kick:1.1, shadow:0.55, exp:0.78}
};
let lightMode = 'estudio';
function setLight(m){
  const L = LIGHT[m]; lightMode = m;
  hemi.intensity = L.hemi; r.toneMappingExposure = L.exp;
  key.intensity = L.key[0]; key.color.setHex(L.key[1]); key.position.set(L.key[2],L.key[3],L.key[4]);
  rim.intensity = L.rim[0]; rim.color.setHex(L.rim[1]); rim.position.set(L.rim[2],L.rim[3],L.rim[4]);
  kick.intensity = L.kick; floor.material.opacity = document.body.classList.contains('verde') ? Math.max(L.shadow,0.35) : L.shadow;
  sc.traverse(o => { if (o.isMesh && o.material && 'envMapIntensity' in o.material) {
    if (o.userData.env0 === undefined) o.userData.env0 = o.material.envMapIntensity;
    o.material.envMapIntensity = o.userData.env0 * L.env; } });
  document.body.classList.toggle('drama', m === 'dramatica');
  if (shelf.visible) applyNight();
}
const bgBtn = document.getElementById('bg');
bgBtn.addEventListener('click', () => { const on = document.body.classList.toggle('verde'); bgBtn.setAttribute('aria-pressed', on); bgBtn.textContent = on ? 'Fundo cinza' : 'Fundo verde'; floor.material.opacity = on ? 0.35 : 0.22; });

function loop(now){
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now;
  if (playing){ const nv = value + dt*2.6; if (nv >= NSTEPS){ apply(NSTEPS); setPlay(false); } else apply(nv); }
  if (tw){ tw.t = Math.min(1, tw.t + dt*2.2); apply(tw.from + (tw.to - tw.from)*tw.t); if (tw.t >= 1) tw = null; }
  if (camTw){ camTw.t = Math.min(1, camTw.t + dt*1.8); const e = 1 - Math.pow(1 - camTw.t, 3); cam.position.lerpVectors(camTw.from, START, e); if (camTw.t >= 1) camTw = null; }
  if (tgTw){ tgTw.t = Math.min(1, tgTw.t + dt*1.8); const e = 1 - Math.pow(1 - tgTw.t, 3); ctl.target.lerpVectors(tgTw.from, TARGET, e); if (tgTw.t >= 1) tgTw = null; }
  ctl.update(); r.render(sc, cam); requestAnimationFrame(loop);
}

new THREE.GLTFLoader().load(MODEL, gl => {
  const root = gl.scene;
  // frisos: contorno de cada peça, como no traço do manual; faces internas sempre visíveis
  const EDGE = {cwhite:0xa9aca7, c288:0x0a2a1c, c72:0x34362f, c15:0xa9aca7};
  const meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
  meshes.forEach(o => {
    o.castShadow = true; o.receiveShadow = true; o.material.side = THREE.DoubleSide;
    // plástico injetado: base acetinada com verniz fino por cima (reflexo nítido nas bordas)
    const gray = o.material.name === 'c72';
    o.material = new THREE.MeshPhysicalMaterial({color: o.material.color, side: THREE.DoubleSide,
      roughness: gray ? 0.5 : 0.42, metalness: 0, clearcoat: gray ? 0.25 : 0.55, clearcoatRoughness: 0.14,
      reflectivity: 0.45, envMapIntensity: 0.7, name: o.material.name});
    const col = EDGE[o.material.name] !== undefined ? EDGE[o.material.name] : 0x666666;
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 30),
      new THREE.LineBasicMaterial({color: col, transparent: true, opacity: 0.5}));
    o.add(lines);
  });
  const parse = n => { const m = n.name.match(/^g(\d+)_s(\d+)_a(\d+)/); return [+m[1], +m[2], +m[3]]; };
  pieces = root.children.slice().sort((a,b) => parse(a)[0] - parse(b)[0]);
  const bySteps = {};
  pieces.forEach(n => { const [, s, a] = parse(n); n.userData.asm = a; (bySteps[s] = bySteps[s] || []).push(n); });
  Object.keys(bySteps).forEach(k => {
    const s = +k, list = bySteps[k], n = list.length, span = 0.55;
    list.forEach((p, j) => { p.userData.t0 = (s - 1) + (n > 1 ? span * j/(n-1) : 0); p.userData.dur = 0.45; });
  });
  const tex = new THREE.TextureLoader().load('assets/escudo.png'); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(0.80,0.72),
    new THREE.MeshPhysicalMaterial({map:tex, transparent:true, roughness:0.42, clearcoat:0.55, clearcoatRoughness:0.14, envMapIntensity:0.7, metalness:0, polygonOffset:true, polygonOffsetFactor:-2}));
  decal.rotation.y = Math.PI; decal.position.set(-0.10, 2.52, -0.0986);
  const host = pieces.find(n => n.name.endsWith('_decal')); if (host) host.add(decal);
  // arte da plaquinha do QR, aplicada na face de cima do tile inclinado
  const qtex = new THREE.TextureLoader().load('assets/plaquinha.png'); qtex.encoding = THREE.sRGBEncoding; qtex.anisotropy = 8;
  const qr = new THREE.Mesh(new THREE.PlaneGeometry(1.20, 0.40),
    new THREE.MeshStandardMaterial({map:qtex, roughness:0.75, metalness:0, envMapIntensity:0.25, polygonOffset:true, polygonOffsetFactor:-2}));
  const N = new THREE.Vector3(0,0.9659,-0.2589), Vv = new THREE.Vector3(0,0.2589,0.9659), U = new THREE.Vector3(-1,0,0);
  qr.matrixAutoUpdate = false;
  qr.matrix.makeBasis(U, Vv, N).setPosition(new THREE.Vector3(0, 0.15897, -0.71566).addScaledVector(N, 0.0015));
  const qhost = pieces.find(n => n.name.includes('_qr')); if (qhost) qhost.add(qr);
  sc.add(root);
  document.getElementById('load').remove();
  // abre já com fundo verde e luz dramática
  bgBtn.click(); setLight('estudio');
  apply(0); setPlay(true); requestAnimationFrame(loop);
}, undefined, () => { document.getElementById('load').textContent = 'Não foi possível carregar o modelo.'; });
}
</script>
